name: Publish to PyPI.org
on:
  release:
    types: [published]
  # Build only, so changes to this workflow are checked before a release.
  pull_request:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Build distributions
        run: python3 -m pip install --upgrade build && python3 -m build
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: [build]
    runs-on: ubuntu-latest
    # Must match the environment name in the trusted publisher on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/organisationsnummer/
    permissions:
      # Required for PyPI trusted publishing (OIDC), no API token needed.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
